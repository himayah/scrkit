name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Real Windows build of the .scr, using the MSVC toolchain that ships with
  # windows-latest runners. This is the project's integration/smoke test
  # for the Win32/OpenGL code that cannot be compiled on Linux.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake + MSVC)
        run: cmake -S . -B build

      - name: Build ScrKit.scr
        run: cmake --build build --config Release

      # Available from any push/PR run's "Artifacts" section as a dev build
      # (kept for 90 days by default). Tagged releases (see the `release`
      # job below) are the durable, user-facing distribution channel.
      - name: Upload .scr artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrKit-scr
          path: build/src/platform/win32/Release/ScrKit.scr

      # The SCRAPI viewer (docs/DESIGN_VIEWER.md), merged into main and released alongside
      # ScrKit.scr as of v3.0.0.
      - name: Upload ScrViewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrViewer-exe
          path: build/src/viewer/win32/Release/ScrViewer.exe

      # ScrApiDemo (docs/SCRAPI_V2_DRAFT.md): a minimal, independent reference .scr that exercises
      # every SCRAPI control pattern, including the ones ScrKit.scr itself never happens to use.
      # Not part of ScrKit's own screensaver experience -- a developer/tester tool for exploring
      # SCRAPI and ScrViewer with a second saver.
      - name: Upload ScrApiDemo artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrApiDemo-scr
          path: build/src/demo/win32/Release/ScrApiDemo.scr

  # On a `v*` tag push, attach the just-built .scr and ScrViewer to a GitHub Release so
  # users can download a stable, versioned build without running CI themselves or
  # building locally.
  release:
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .scr built by windows-build
        uses: actions/download-artifact@v4
        with:
          name: ScrKit-scr

      - name: Download ScrViewer built by windows-build
        uses: actions/download-artifact@v4
        with:
          name: ScrViewer-exe

      - name: Download ScrApiDemo built by windows-build
        uses: actions/download-artifact@v4
        with:
          name: ScrApiDemo-scr

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScrKit.scr
            ScrViewer.exe
            ScrApiDemo.scr

  # Platform-independent core logic (spiral math, state machine, config
  # parsing, particle grid, GPU tier classification, ...) built and unit
  # tested on Linux.
  linux-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (core + tests only)
        run: cmake -S . -B build -DBUILD_CORE_TESTS_ONLY=ON

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
