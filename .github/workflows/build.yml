name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Real Windows build of the .scr, using the MSVC toolchain that ships with
  # windows-latest runners. This is the project's integration/smoke test
  # for the Win32/OpenGL code that cannot be compiled on Linux.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake + MSVC)
        run: cmake -S . -B build

      - name: Build SpiralSuctionSaver.scr
        run: cmake --build build --config Release

      # Available from any push/PR run's "Artifacts" section as a dev build
      # (kept for 90 days by default). Tagged releases (see the `release`
      # job below) are the durable, user-facing distribution channel.
      - name: Upload .scr artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiralSuctionSaver-scr
          path: build/src/platform/win32/Release/SpiralSuctionSaver.scr

      # The SCRAPI viewer (docs/DESIGN_VIEWER.md) -- a dev build for now; not attached to releases.
      - name: Upload ScrViewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrViewer-exe
          path: build/src/viewer/win32/Release/ScrViewer.exe

  # On a `v*` tag push, attach the just-built .scr to a GitHub Release so
  # users can download a stable, versioned build without running CI
  # themselves or building locally.
  release:
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .scr built by windows-build
        uses: actions/download-artifact@v4
        with:
          name: SpiralSuctionSaver-scr

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SpiralSuctionSaver.scr

  # Platform-independent core logic (spiral math, state machine, config
  # parsing, particle grid, GPU tier classification, ...) built and unit
  # tested on Linux.
  linux-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (core + tests only)
        run: cmake -S . -B build -DBUILD_CORE_TESTS_ONLY=ON

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
